name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build kext (English device names)
        run: |
          ./build-kext.sh
          mkdir -p out
          ditto -c -k --keepParent build/VoodooHDA.kext out/VoodooHDA-SOF-en.zip

      - name: Build kext (Turkish device names)
        run: |
          SOF_LANG=tr ./build-kext.sh
          ditto -c -k --keepParent build/VoodooHDA.kext out/VoodooHDA-SOF-tr.zip

      - name: Build SofMicBar
        run: |
          tools/SofMicBar/build.sh
          ditto -c -k --keepParent tools/SofMicBar/build/SofMicBar.app out/SofMicBar.zip

      - name: Build test tools
        run: tools/sof-test/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VoodooHDA-SOF-${{ github.sha }}
          path: out/*.zip
