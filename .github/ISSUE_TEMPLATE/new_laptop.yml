name: Support for another laptop / Başka bir laptop için destek
description: Share a Linux capture so the DMIC setup of your laptop can be added / Laptopunuzun DMIC ayarının eklenebilmesi için Linux kaydı paylaşın
labels: [new hardware]
body:
  - type: markdown
    attributes:
      value: |
        See [sof/README.md](../blob/main/sof/README.md) ([Türkçe](../blob/main/sof/README.tr.md)). On Linux, with the internal mic working:
        `sudo bash sof/linux-capture/sof-trace.sh setup` → reboot / yeniden başlat → `sudo bash sof/linux-capture/sof-trace.sh collect`
  - type: input
    id: laptop
    attributes:
      label: Laptop model / Laptop modeli
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU / İşlemci
    validations:
      required: true
  - type: textarea
    id: lspci
    attributes:
      label: "`lspci -nn | grep -i audio`"
      render: text
    validations:
      required: true
  - type: textarea
    id: sofinfo
    attributes:
      label: SOF firmware and topology / SOF firmware ve topolojisi
      description: "`sudo dmesg | grep -iE 'Firmware file|Topology file|Firmware info'`"
      render: text
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Capture files / Kayıt dosyaları
      description: |
        Zip and attach the `~/sof-ref/trace-*` folder (dmesg-trace.txt, firmware/NHLT.aml, ...).
        `~/sof-ref/trace-*` klasörünü zipleyip ekleyin (dmesg-trace.txt, firmware/NHLT.aml, ...).
    validations:
      required: true
