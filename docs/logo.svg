  <circle cx="668" cy="270" r="26" fill="#E5484D"/>
  <!-- mic head -->
  <circle cx="355" cy="362" r="56" fill="#D9DDE4"/>
  <g stroke="#A9B0BC" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M305 345 Q355 330 405 345"/>
    <path d="M300 368 Q355 352 410 368"/>
    <path d="M308 391 Q355 377 402 391"/>
    <path d="M335 310 Q325 362 338 414"/>
    <path d="M375 310 Q385 362 372 414"/>
  </g>
  <circle cx="355" cy="362" r="56" fill="none" stroke="#C3C8D1" stroke-width="6"/>
</svg>
